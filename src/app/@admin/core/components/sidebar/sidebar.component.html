<div class="sidebar__wrapper" id="sidebar-wrapper">
  <div class="sidebar-heading sidebar__title__container px-4 py-3">
    <a
      class="sidebar__title d-flex align-items-center"
      [routerLink]="['/']"
    >
      <i class="fas fa-gamepad mr-2 text-accent"></i>
      <span class="brand-name">GAMEZONIA</span>
      <span class="admin-badge ml-2">ADMIN</span>
    </a>
  </div>

  <div class="list-group list-group-flush px-2 py-3">
    <a
      [routerLink]="item.url"
      [routerLinkActiveOptions]="{ exact: item.url === '/admin' }"
      routerLinkActive="active-admin-link"
      class="list-group-item admin-nav-item"
      *ngFor="let item of menuItems"
    >
      <i class="{{ item.icon }} nav-icon mr-3"></i>
      <span class="nav-text">{{ item.label }}</span>
    </a>
  </div>
</div>
