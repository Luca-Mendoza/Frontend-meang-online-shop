<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
  <div class="container-fluid px-4">
    <!-- Mobile Brand Toggle Button -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-toggle="collapse"
      data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Main Navigation Items -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item" *ngFor="let item of menuItems">
          <a
            class="nav-link custom-nav-item"
            [routerLink]="item.url"
            routerLinkActive="active-nav-link"
          >
            {{ item.label }}
          </a>
        </li>
      </ul>

      <!-- User & Cart Utilities -->
      <ul class="navbar-nav ml-auto align-items-center flex-row">
        <!-- Admin link if applicable -->
        <li class="nav-item mr-2" *ngIf="access && role == 'ADMIN'">
          <a
            class="btn btn-sm btn-outline-warning rounded-pill px-3 font-weight-bold"
            [routerLink]="['/admin']"
            routerLinkActive="active"
          >
            <i class="fas fa-user-shield mr-1"></i> Admin
          </a>
        </li>

        <!-- Guest Links -->
        <li class="nav-item" *ngIf="!access">
          <a
            class="nav-link custom-nav-item mr-2"
            [routerLink]="['/login']"
            routerLinkActive="active-nav-link"
          >
            <i class="fas fa-sign-in-alt mr-1"></i> Entrar
          </a>
        </li>
        <li class="nav-item" *ngIf="!access">
          <a
            class="btn btn-sm btn-accent rounded-pill px-3 mr-3"
            [routerLink]="['/register']"
            routerLinkActive="active"
          >
            Registro
          </a>
        </li>

        <!-- Logged-in User Dropdown -->
        <li class="nav-item dropdown mr-3" *ngIf="access">
          <a
            class="nav-link dropdown-toggle user-pill"
            href="#"
            id="navbarDropdown"
            role="button"
            data-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <i class="far fa-user-circle mr-1 text-accent"></i> {{ userLabel }}
          </a>
          <div
            class="dropdown-menu dropdown-menu-right custom-dropdown"
            aria-labelledby="navbarDropdown"
          >
            <a class="dropdown-item" href="#">
              <i class="fas fa-id-card mr-2 text-muted"></i> Mi Perfil
            </a>
            <a
              class="dropdown-item"
              [routerLink]="'/orders'"
              routerLinkActive="active"
            >
              <i class="fas fa-box-open mr-2 text-muted"></i> Mis Pedidos
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item text-danger" (click)="logout()">
              <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </a>
          </div>
        </li>

        <!-- Floating Cart Trigger -->
        <li class="nav-item">
          <button
            class="cart-btn d-flex align-items-center"
            (click)="open()"
            title="Ver mi carrito"
          >
            <div class="cart-icon-wrapper">
              <i class="fas fa-shopping-bag"></i>
              <span class="cart-badge">{{ cartItemsTotal }}</span>
            </div>
            <span class="cart-label d-none d-md-inline-block ml-2">Carrito</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
