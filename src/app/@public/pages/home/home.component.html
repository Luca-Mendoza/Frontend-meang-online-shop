<!-- Skeleton Loading View for Home Page -->
<div class="home-wrapper pb-5" *ngIf="loading">
  <div class="carousel-hero-container mb-5">
    <div class="container-fluid px-lg-5">
      <div class="skeleton-box" style="width: 100%; height: 380px; border-radius: 12px;"></div>
    </div>
  </div>

  <div class="container px-lg-4 mb-5">
    <div class="row">
      <div class="col-md-4 mb-3" *ngFor="let item of [1,2,3]">
        <div class="skeleton-box" style="width: 100%; height: 80px; border-radius: 12px;"></div>
      </div>
    </div>
  </div>

  <div class="container px-lg-4">
    <div class="mb-4">
      <div class="skeleton-box mb-2" style="width: 280px; height: 32px;"></div>
    </div>
    <div class="row mb-5">
      <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let item of [1,2,3,4]">
        <div class="skeleton-card">
          <div class="skeleton-box skeleton-img"></div>
          <div class="skeleton-box skeleton-title"></div>
          <div class="skeleton-box skeleton-text"></div>
          <div class="skeleton-box skeleton-price"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Main Loaded Home Content -->
<div class="home-wrapper pb-5" *ngIf="!loading">
  <!-- Top Hero Carousel Container -->
  <div class="carousel-hero-container mb-5">
    <div class="container-fluid px-lg-5">
      <div class="carousel-card-wrapper">
        <shop-carousel-items [items]="items"></shop-carousel-items>
      </div>
    </div>
  </div>

  <!-- Trust Badges Banner -->
  <div class="container px-lg-4 mb-5">
    <div class="trust-banner p-4 rounded-24">
      <div class="row align-items-center text-center text-md-left">
        <div class="col-md-4 mb-3 mb-md-0 d-flex align-items-center justify-content-center justify-content-md-start">
          <div class="trust-icon mr-3">
            <i class="fas fa-key"></i>
          </div>
          <div>
            <h6 class="mb-0 text-white font-weight-bold">Licencias 100% Oficiales</h6>
            <small class="text-muted">Garantía de activación inmediata</small>
          </div>
        </div>
        <div class="col-md-4 mb-3 mb-md-0 d-flex align-items-center justify-content-center">
          <div class="trust-icon mr-3">
            <i class="fas fa-percentage"></i>
          </div>
          <div>
            <h6 class="mb-0 text-white font-weight-bold">Hasta 70% de Descuento</h6>
            <small class="text-muted">Ofertas renovadas cada 24hs</small>
          </div>
        </div>
        <div class="col-md-4 d-flex align-items-center justify-content-center justify-content-md-end">
          <div class="trust-icon mr-3">
            <i class="fas fa-user-shield"></i>
          </div>
          <div>
            <h6 class="mb-0 text-white font-weight-bold">Compra Protegida</h6>
            <small class="text-muted">Soporte directo ante cualquier duda</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Categories -->
  <div class="container px-lg-4">
    <app-product-category-list
      *ngIf="listOne"
      [title]="'Juegos de PC Gamer'"
      [description]="'Los títulos más populares para dominar en ordenador'"
      [productsList]="listOne"
      [showDesc]="false"
    ></app-product-category-list>

    <div class="my-5 custom-divider"></div>

    <app-product-category-list
      *ngIf="listTwo"
      [title]="'Juegos Más Económicos'"
      [description]="'Aprovecha los mejores precios sin comprometer la diversión'"
      [productsList]="listTwo"
      [showDesc]="true"
    ></app-product-category-list>

    <div class="my-5 custom-divider"></div>

    <app-product-category-list
      *ngIf="listThree"
      [title]="'Juegos de PlayStation'"
      [description]="'Aventuras épicas seleccionadas para consola'"
      [productsList]="listThree"
      [showDesc]="false"
    ></app-product-category-list>
  </div>
</div>
