<div class="container">
    <div class="row">
      <div class="col-lg"></div>
  
      <div class="col-lg-6">
        <form (ngSubmit)="reset()" #forma="ngForm">
          <h1>Cambiar contraseña</h1>
          <p>Introduzca el password y verificalo antes de cambiar la contraseña.</p>

  
          <label for="password"><b>Contraseña</b></label>
          <div class="password-input-group mb-2">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="Introduzca la contraseña" name="password" #password="ngModel"
              [(ngModel)]="values.password" required class="form-control" [ngClass]="{
                'is-valid': !password.invalid,
                'is-invalid': password.invalid
              }" />
            <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()" [title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
          <div class="alert alert-danger" *ngIf="password.invalid && (password.dirty || password.touched)">
            <div class="" *ngIf="password.errors.required">
              Introdusca una contraseña válida por favor
            </div>
          </div>
  
          <label for="passwordTwo"><b> Repetir contraseña</b></label>
          <div class="password-input-group mb-2">
            <input [type]="showPasswordTwo ? 'text' : 'password'" placeholder="Repita la contraseña" name="passwordTwo" #passwordTwo="ngModel"
              [(ngModel)]="values.passwordTwo" required class="form-control" [ngClass]="{
                'is-valid': !passwordTwo.invalid,
                'is-invalid': passwordTwo.invalid
              }" />
            <button type="button" class="toggle-password-btn" (click)="togglePasswordTwoVisibility()" [title]="showPasswordTwo ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="fas" [ngClass]="showPasswordTwo ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
  
          <div class="alert alert-danger" *ngIf="
              passwordTwo.invalid && (passwordTwo.dirty || passwordTwo.touched)
            ">
            <div *ngIf="passwordTwo.errors.required">
              Introduzca una contraseña por favor
            </div>
          </div>
  
          <div class="row">
            <div class="col-lg">
              <button type="submit" [disabled]="!forma.valid" class="signup-btn">
                Cambiar contraseña
              </button>
            </div>
          </div>
        </form>
      </div>
  
      <div class="col-lg"></div>
    </div>
  </div>
