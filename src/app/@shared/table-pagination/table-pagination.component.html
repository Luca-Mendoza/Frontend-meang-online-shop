<div class="admin-table-container">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="m-0 font-weight-bold text-white">Listado de Registros</h4>
    <div class="d-flex align-items-center gap-2">
      <select 
        class="custom-select custom-select-dark mr-2" 
        style="width: auto" 
        [(ngModel)]="filterActiveValues"
        (ngModelChange)="loadData()"
      >
        <option [ngValue]="'ALL'">Todos</option>
        <option [ngValue]="'ACTIVE'">Activos</option>
        <option [ngValue]="'INACTIVE'">Inactivos</option>
      </select>
      <button class="btn btn-accent-add" (click)="manageAction('add', '')">
        <i class="fas fa-plus-circle mr-1"></i> Añadir
      </button>
    </div>
  </div>

  <div class="table-responsive rounded-lg">
    <table class="table table-dark-custom">
      <thead>
        <tr>
          <th scope="col" *ngFor="let column of tableColumns">
            {{ column.label }}
          </th>
          <th scope="col" class="text-right">Gestionar Información</th>
        </tr>
      </thead>
      <tbody *ngIf="loading">
        <tr *ngFor="let item of [1,2,3,4]">
          <td [attr.colspan]="tableColumns.length + 1" class="py-3">
            <div class="skeleton-box" style="width: 100%; height: 32px; border-radius: 6px;"></div>
          </td>
        </tr>
      </tbody>
      <tbody *ngIf="data$ | async as items">
        <tr *ngIf="items.length === 0">
          <td [attr.colspan]="tableColumns.length + 1" class="text-center py-4 text-muted">
            <i class="fas fa-folder-open mr-2 font-size-lg"></i> No se encontraron registros cargados.
          </td>
        </tr>
        <tr *ngFor="let data of items">
          <td *ngFor="let val of tableColumns">
            <span *ngIf="val.property !== 'active'; else activeValue">
              <span *ngIf="val.property === 'role'" [class.badge-admin]="data[val.property] === 'ADMIN'" [class.badge-client]="data[val.property] !== 'ADMIN'" class="badge-role">
                {{ data[val.property] }}
              </span>
              <span *ngIf="val.property !== 'role'">
                {{ data[val.property] }}
              </span>
            </span>
            <ng-template #activeValue>
              <span *ngIf="data[val.property] === true" class="status-badge status-active">
                <i class="fas fa-check-circle mr-1"></i> Activo
              </span>
              <span *ngIf="data[val.property] !== true" class="status-badge status-inactive">
                <i class="fas fa-times-circle mr-1"></i> Inactivo
              </span>
            </ng-template>
          </td>
          <td class="text-right">
            <div class="btn-group-actions">
              <button type="button" class="btn btn-action btn-edit" (click)="manageAction('edit', data)" title="Editar">
                <i class="fas fa-edit"></i>
              </button>
              <button type="button" class="btn btn-action btn-info" (click)="manageAction('info', data)" title="Ver Detalle">
                <i class="fas fa-info-circle"></i>
              </button>
              <button type="button" class="btn btn-action btn-lock" (click)="manageAction('block', data)" *ngIf="data['active'] !== false; else unblockBtn" title="Bloquear">
                <i class="fas fa-lock"></i>
              </button>
              <ng-template #unblockBtn>
                <button type="button" class="btn btn-action btn-unlock" (click)="manageAction('unblock', data)" title="Desbloquear">
                  <i class="fas fa-lock-open"></i>
                </button>
              </ng-template>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
    <ngb-pagination 
      [collectionSize]="infoPage.total" 
      [(page)]="infoPage.page" 
      [pageSize]="infoPage.itemsPage"
      (pageChange)="refreshPage()"
    >
    </ngb-pagination>

    <select class="custom-select custom-select-dark" style="width: auto" [(ngModel)]="infoPage.itemsPage" (ngModelChange)="loadData()">
      <option [ngValue]="5">5 por página</option>
      <option [ngValue]="10">10 por página</option>
      <option [ngValue]="20">20 por página</option>
    </select>
  </div>
</div>
