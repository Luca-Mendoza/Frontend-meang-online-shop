<div class="kpi-card shadow-sm mb-4">
  <div class="kpi-icon-wrapper mb-3">
    <i class="{{ item.icon }}"></i>
  </div>
  <div class="kpi-info text-center">
    <h3 class="kpi-value font-weight-bold text-white">{{ item.value || 0 }}</h3>
    <span class="kpi-title text-muted text-uppercase">{{ item.title }}</span>
  </div>
</div>
